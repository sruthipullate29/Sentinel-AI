version: '3.9'

services:
  # ── Vectorize Hindsight (local memory engine) ─────────────────────────────
  hindsight:
    image: vectorize/hindsight:latest
    container_name: vision404-hindsight
    ports:
      - "8888:8888"
    volumes:
      - hindsight_data:/data
    environment:
      - HINDSIGHT_STORAGE_PATH=/data
    restart: unless-stopped

  # ── Vision404 Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vision404-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HINDSIGHT_API_URL=http://hindsight:8888
      - HINDSIGHT_BANK_ID=vision404-local
    env_file:
      - .env
    depends_on:
      - hindsight
    restart: unless-stopped
    # Note: to monitor the HOST machine the backend must run on host network
    # or use host.docker.internal for psutil. For development, run directly.

  # ── Vision404 Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./vision404
      dockerfile: Dockerfile
    container_name: vision404-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hindsight_data:
    driver: local
